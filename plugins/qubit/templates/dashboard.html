<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --card:#f5f5f7; --bd:#ddd;
          --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --run:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --mut:#999; --card:#1c1c1e; --bd:#333;
            --ok:#3fb950; --warn:#d29922; --bad:#f85149; --run:#58a6ff; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,system-ui,sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--mut); margin-bottom:16px; }
  #board { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr)); gap:12px; align-items:start; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:12px; min-width:0; }
  .card h2 { font-size:14px; margin:0 0 6px; word-break:break-word; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid currentColor; white-space:nowrap; }
  .mr-open,.merged,.APPROVE,.PASS { color:var(--ok); } .needs-human,.failed,.CHANGES,.ESCALATE,.FAIL { color:var(--bad); }
  .building,.reviewing,.gates,.approving,.spec { color:var(--run); }
  .row { margin:6px 0; color:var(--mut); } .row b { color:var(--fg); font-weight:600; }
  .row a { color:var(--run); word-break:break-all; }
  details { margin-top:8px; } summary { cursor:pointer; color:var(--mut); }
  pre { white-space:pre-wrap; word-break:break-word; background:var(--bg); border:1px solid var(--bd); border-radius:6px; padding:8px; max-height:320px; overflow:auto; font-size:12px; margin:6px 0 0; }
  .err { color:var(--bad); }

  /* barra de etapas */
  .stages { display:flex; gap:3px; margin:10px 0 4px; }
  .stage { flex:1 1 0; min-width:0; text-align:center; font-size:10px; font-weight:600; letter-spacing:.02em; color:var(--mut); }
  .stage::before { content:""; display:block; height:5px; border-radius:3px; background:var(--bd); margin-bottom:3px; }
  .stage.done { color:var(--ok); } .stage.done::before { background:var(--ok); }
  .stage.cur { color:var(--run); } .stage.cur::before { background:var(--run); box-shadow:0 0 0 2px color-mix(in srgb, var(--run) 30%, transparent); }
  .stage.stop { color:var(--bad); } .stage.stop::before { background:var(--bad); }
  .stage span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media (max-width:420px) { .stages { gap:2px; } .stage { font-size:8.5px; letter-spacing:0; } }

  /* linha do tempo */
  .tl { list-style:none; margin:6px 0 0; padding:0 0 0 14px; border-left:2px solid var(--bd); }
  .tl li { position:relative; padding:3px 0 5px 4px; font-size:12px; }
  .tl li::before { content:""; position:absolute; left:-20px; top:8px; width:8px; height:8px; border-radius:50%; background:var(--run); border:2px solid var(--card); }
  .tl li:last-child::before { background:var(--ok); }
  .tl .t { color:var(--mut); font-variant-numeric:tabular-nums; margin-right:6px; }
  .tl .a { font-weight:600; } .tl .m { color:var(--mut); }
  .tl .n { display:block; color:var(--mut); word-break:break-word; }
  .tag { display:inline-block; font-size:11px; padding:0 6px; border-radius:4px; background:var(--bg); border:1px solid var(--bd); color:var(--mut); margin-left:4px; }

  /* abas por rodada */
  .tabs { display:flex; gap:4px; margin-top:10px; border-bottom:1px solid var(--bd); overflow-x:auto; }
  .tabs button { font:inherit; font-size:12px; background:none; border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0;
                 padding:4px 10px; color:var(--mut); cursor:pointer; margin-bottom:-1px; white-space:nowrap; }
  .tabs button[aria-selected="true"] { background:var(--bg); border-color:var(--bd); color:var(--fg); font-weight:600; }
  .files { display:flex; flex-direction:column; gap:2px; padding:6px 0 0; }
  .files button { font:inherit; font-size:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; text-align:left;
                  background:none; border:1px solid transparent; border-radius:6px; padding:3px 6px; color:var(--fg); cursor:pointer; }
  .files button:hover { border-color:var(--bd); }
  .files button[aria-pressed="true"] { background:var(--bg); border-color:var(--bd); }
  .files .missing { color:var(--mut); cursor:default; }
  .empty { color:var(--mut); font-size:12px; padding:6px 0; }
</style>
</head>
<body>
<h1>Software Factory</h1>
<div class="sub" id="meta">Servir com: <code>python3 -m http.server -d factory 8000</code></div>
<div id="board"></div>
<script>
const $ = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const get = async (u) => { const r = await fetch(u, {cache:'no-store'}); if (!r.ok) throw new Error(u + ' ' + r.status); return r; };
const text = async (u) => { try { return await (await get(u)).text(); } catch { return null; } };
const verdict = (t) => (t || '').split('\n', 1)[0].replace(/^(VERDICT|GATES):/, '').trim();

// Estado da UI por job (sobrevive ao refresh): aba, arquivo aberto, detalhes abertos, scroll.
const ui = {};
const st = (id) => (ui[id] ||= { tab: null, file: null, open: new Set(), scroll: {} });

// Listagem de diretório do http.server → { dirs, files }
async function listDir(url) {
  const html = await text(url); if (html == null) return { dirs: [], files: [] };
  // só entradas diretas (sem "/" no meio), ignorando ocultos
  const hrefs = [...html.matchAll(/href="([^"?#]+)"/g)].map(m => decodeURIComponent(m[1]))
    .filter(h => !h.startsWith('.') && !h.slice(0, -1).includes('/'));
  return { dirs: hrefs.filter(h => h.endsWith('/')).map(h => h.slice(0, -1)),
           files: hrefs.filter(h => !h.endsWith('/')) };
}

// ---------- barra de etapas ----------
const STAGES = ['INIT', 'SPEC', 'BUILD', 'GATES', 'REVIEW', 'APPROVE', 'MR'];
const BY_STATUS = { init:0, spec:1, building:2, gates:3, reviewing:4, approving:5 };
const DONE = ['mr-open', 'merged'];   // 'merged' só existe em jobs de versões antigas da fábrica
function stageFromAgent(a) {
  if (!a) return 0;
  if (a === 'spec-writer') return 1;
  if (a === 'builder') return 2;
  if (a === 'gates') return 3;
  if (a.startsWith('reviewer')) return 4;
  if (a === 'approver') return 5;
  return null;
}
// Retorna { idx, mode } onde mode ∈ run | stop | done
function currentStage(job, decision) {
  const s = job.status;
  if (DONE.includes(s)) return { idx: 6, mode: 'done' };
  if (s in BY_STATUS) return { idx: BY_STATUS[s], mode: 'run' };
  if (s === 'needs-human' || s === 'failed') {
    if (verdict(decision) === 'APPROVE') return { idx: 6, mode: 'stop' };   // aprovado, mas o MR não foi aberto
    const evs = job.events || [];
    for (let i = evs.length - 1; i >= 0; i--) { const k = stageFromAgent(evs[i].agent); if (k != null) return { idx: k, mode: 'stop' }; }
    return { idx: 0, mode: 'stop' };
  }
  return { idx: 0, mode: 'run' };
}
function stageBar(job, decision) {
  const { idx, mode } = currentStage(job, decision);
  const bar = $('div', 'stages'); bar.setAttribute('role', 'list');
  STAGES.forEach((name, i) => {
    let cls = '';
    if (mode === 'done' || i < idx) cls = 'done';
    else if (i === idx) cls = mode === 'stop' ? 'stop' : 'cur';
    const el = $('div', 'stage ' + cls); el.append($('span', null, name)); el.setAttribute('role', 'listitem');
    el.title = name + (cls === 'cur' ? ' (atual)' : cls === 'stop' ? ' (parou aqui)' : cls === 'done' ? ' (concluída)' : '');
    if (cls === 'cur' || cls === 'stop') el.setAttribute('aria-current', 'step');
    bar.append(el);
  });
  return bar;
}

// ---------- detalhes com estado persistente ----------
function persistentDetails(id, key, label, fill) {
  const s = st(id); const d = $('details'); d.append($('summary', null, label));
  const body = $('div'); d.append(body);
  const load = async () => { if (d.open) { body.replaceChildren(); await fill(body); } };
  d.addEventListener('toggle', () => { d.open ? s.open.add(key) : s.open.delete(key); load(); });
  if (s.open.has(key)) { d.open = true; }
  return d;
}

// ---------- linha do tempo ----------
function fmtTime(iso) {
  const d = new Date(iso); if (isNaN(d)) return iso || '?';
  const t = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }) + ' ' + t;
}
function timeline(job) {
  const evs = [...(job.events || [])].sort((a, b) => String(a.at).localeCompare(String(b.at)));
  const ul = $('ul', 'tl');
  for (const e of evs) {
    const li = $('li');
    li.append($('span', 't', fmtTime(e.at)), $('span', 'a', e.agent || '?'));
    if (e.model) li.append($('span', 'tag', e.model));
    if (e.round != null) li.append($('span', 'tag', 'rodada ' + e.round));
    if (e.note) li.append($('span', 'n', e.note));
    ul.append(li);
  }
  return ul;
}

// ---------- abas por rodada ----------
async function roundTabs(id, job, rounds) {
  const s = st(id); const wrap = $('div');
  if (!rounds.length) { wrap.append($('div', 'empty', 'Nenhuma rodada ainda.')); return wrap; }
  if (s.tab == null || !rounds.includes(s.tab)) s.tab = rounds[rounds.length - 1];

  const tabs = $('div', 'tabs'); tabs.setAttribute('role', 'tablist');
  for (const r of rounds) {
    const b = $('button', null, 'Rodada ' + r); b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(r === s.tab));
    b.addEventListener('click', () => { s.tab = r; s.file = null; refreshCard(id); });
    tabs.append(b);
  }
  wrap.append(tabs);

  const panel = $('div'); panel.setAttribute('role', 'tabpanel'); wrap.append(panel);
  const base = `jobs/${id}/round-${s.tab}/`;
  const { files } = await listDir(base);
  // gates.md primeiro, depois revisores (os esperados aparecem mesmo se ainda não existem)
  const expected = s.tab === job.round ? (job.reviewers || []).map(n => `review-${n}.md`) : [];
  const names = [...new Set(['gates.md', ...expected, ...files.filter(f => f.endsWith('.md')).sort()])]
    .filter(f => f === 'gates.md' || files.includes(f) || expected.includes(f));
  names.sort((a, b) => (a === 'gates.md' ? -1 : b === 'gates.md' ? 1 : a.localeCompare(b)));

  const list = $('div', 'files'); panel.append(list);
  for (const f of names) {
    const exists = files.includes(f);
    const label = f === 'gates.md' ? 'gates' : f.replace(/^review-|\.md$/g, '');
    const b = $('button', exists ? '' : 'missing'); b.append($('span', null, label));
    if (exists) {
      const v = verdict(await text(base + f)) || '?';
      b.append($('span', 'pill ' + v, v));
      b.setAttribute('aria-pressed', String(s.file === f));
      b.addEventListener('click', () => { s.file = s.file === f ? null : f; refreshCard(id); });
    } else { b.append($('span', 'pill', '…')); b.disabled = true; b.title = 'ainda não existe'; }
    list.append(b);
  }
  if (s.file && files.includes(s.file)) {
    const key = s.tab + '/' + s.file;
    const pre = $('pre', null, (await text(base + s.file)) ?? '(não existe)');
    pre.addEventListener('scroll', () => { s.scroll[key] = pre.scrollTop; });
    panel.append(pre);
    requestAnimationFrame(() => { pre.scrollTop = s.scroll[key] || 0; });
  }
  return wrap;
}

// ---------- card ----------
async function card(id) {
  const c = $('div', 'card'); c.dataset.id = id; const h = $('h2', null, id); c.append(h);
  let job;
  try { job = await (await get(`jobs/${id}/job.json`)).json(); } catch { c.append($('div', 'err', 'job.json ausente ou inválido')); return c; }
  const decision = await text(`jobs/${id}/decision.md`);
  h.append(' ', $('span', 'pill ' + job.status, job.status));
  c.append($('div', 'row', job.title || ''));
  c.append(stageBar(job, decision));
  const r = $('div', 'row'); r.append('tipo ', $('b', null, job.type), ' · rodada ', $('b', null, `${job.round}/${job.max_rounds}`),
    ' · chamadas ', $('b', null, `${(job.events || []).length}/${job.max_agent_calls}`)); c.append(r);
  if (job.branch || job.mr) {
    const br = $('div', 'row');
    if (job.branch) br.append('branch ', $('b', null, job.branch));
    if (/^https?:\/\//.test(job.mr || '')) {   // só http(s): o valor vem de um arquivo
      const a = $('a', null, job.mr); a.href = job.mr; a.target = '_blank'; a.rel = 'noopener noreferrer';
      br.append(job.branch ? ' · MR ' : 'MR ', a);
    }
    c.append(br);
  }
  if (decision != null) { const d = verdict(decision); const dr = $('div', 'row'); dr.append('decisão ', $('span', 'pill ' + d, d)); c.append(dr); }

  // rodadas: diretórios round-N/ existentes ∪ 1..job.round
  const { dirs } = await listDir(`jobs/${id}/`);
  const rounds = new Set(dirs.map(d => /^round-(\d+)$/.exec(d)).filter(Boolean).map(m => +m[1]));
  for (let i = 1; i <= (job.round || 0); i++) rounds.add(i);
  c.append(await roundTabs(id, job, [...rounds].sort((a, b) => a - b)));

  const n = (job.events || []).length;
  c.append(persistentDetails(id, 'timeline', `linha do tempo (${n})`, async (b) => b.append(n ? timeline(job) : $('div', 'empty', 'Sem eventos.'))));
  for (const f of ['spec.md', 'build.md', 'decision.md', 'baseline.md']) {
    c.append(persistentDetails(id, f, f, async (b) => b.append($('pre', null, (await text(`jobs/${id}/${f}`)) ?? '(não existe ainda)'))));
  }
  c.querySelectorAll('details[open]').forEach(d => d.dispatchEvent(new Event('toggle')));
  return c;
}

async function refreshCard(id) {
  const old = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  const neu = await card(id); if (old) old.replaceWith(neu);
}

let busy = false;
async function refresh() {
  if (busy) return; busy = true;
  try {
    const { dirs } = await listDir('jobs/');
    const ids = dirs.sort();
    const cards = await Promise.all(ids.map(card));
    const board = document.getElementById('board'); board.replaceChildren(...cards);
    if (!ids.length) board.append($('div', 'sub', 'Nenhum job ainda. Rode /qubit <descrição>.'));
    document.getElementById('meta').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR') + ' · a cada 2 s';
  } catch (e) { document.getElementById('meta').textContent = 'Erro: ' + e.message + ' (sirva a pasta factory/ com http.server)'; }
  finally { busy = false; }
}
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
