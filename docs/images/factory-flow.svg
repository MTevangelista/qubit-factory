<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1500" viewBox="0 0 1040 1500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .s  { font-size: 12.5px; fill: #3d444d; }
      .l  { font-size: 12px; fill: #57606a; font-style: italic; }
      .lh { font-size: 12px; fill: #b35c00; font-weight: 600; }
      .c  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #1f2328; }
      .step  { fill: #eef2fb; stroke: #3b6fd8; stroke-width: 1.6; }
      .gate  { fill: #e3ecff; stroke: #3b6fd8; stroke-width: 1.6; }
      .human { fill: #fff1e3; stroke: #d9822b; stroke-width: 1.6; }
      .ok    { fill: #dff5e1; stroke: #2e8b57; stroke-width: 1.6; }
      .start { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.6; }
      .e  { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .eh { stroke: #d9822b; stroke-width: 1.6; fill: none; marker-end: url(#ah); stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1040" height="1500" fill="#ffffff"/>

  <text x="40" y="36" style="font-size:22px;font-weight:800;fill:#1f2328">Fluxo da fábrica /qubit</text>
  <text x="40" y="58" class="s">Caminho automático no centro · paradas que exigem você à direita</text>

  <!-- Início -->
  <rect x="250" y="80" width="300" height="50" rx="25" class="start"/>
  <text x="400" y="101" class="t" text-anchor="middle">Você</text>
  <text x="400" y="119" class="c" text-anchor="middle">/qubit &lt;descrição&gt; · /qubit next</text>
  <line x1="400" y1="130" x2="400" y2="158" class="e"/>

  <!-- 1 INIT -->
  <rect x="250" y="160" width="300" height="68" rx="10" class="step"/>
  <text x="400" y="184" class="t" text-anchor="middle">1 · INIT</text>
  <text x="400" y="203" class="s" text-anchor="middle">job.json · worktree · branch factory/&lt;id&gt;</text>
  <text x="400" y="220" class="s" text-anchor="middle">baseline dos gates (o que já quebrava)</text>
  <line x1="400" y1="228" x2="400" y2="256" class="e"/>

  <!-- 2 SPEC -->
  <rect x="250" y="258" width="300" height="68" rx="10" class="step"/>
  <text x="400" y="282" class="t" text-anchor="middle">2 · SPEC</text>
  <text x="400" y="301" class="s" text-anchor="middle">spec-writer → spec.md</text>
  <text x="400" y="318" class="s" text-anchor="middle">critérios verificáveis AC-1, AC-2…</text>

  <line x1="550" y1="292" x2="688" y2="292" class="eh"/>
  <text x="619" y="284" class="lh" text-anchor="middle">dúvidas</text>
  <rect x="690" y="258" width="310" height="68" rx="10" class="human"/>
  <text x="845" y="282" class="t" text-anchor="middle">🧑 needs-human</text>
  <text x="845" y="301" class="s" text-anchor="middle">dúvidas bloqueantes no spec</text>
  <text x="845" y="318" class="s" text-anchor="middle">responda e rode /qubit de novo</text>

  <!-- Loop container -->
  <rect x="40" y="356" width="600" height="474" rx="14" fill="#fafbfc" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="60" y="380" style="font-size:13px;font-weight:700;fill:#57606a">LOOP DE CONSTRUÇÃO · até max_rounds rodadas</text>

  <line x1="400" y1="326" x2="400" y2="396" class="e"/>
  <text x="410" y="346" class="l">spec OK</text>

  <!-- 3 BUILD -->
  <rect x="250" y="398" width="300" height="68" rx="10" class="step"/>
  <text x="400" y="422" class="t" text-anchor="middle">3 · BUILD</text>
  <text x="400" y="441" class="s" text-anchor="middle">builder implementa + testes no worktree</text>
  <text x="400" y="458" class="s" text-anchor="middle">commits + build.md</text>
  <line x1="400" y1="466" x2="400" y2="490" class="e"/>

  <!-- 4 GATES -->
  <polygon points="400,492 560,542 400,592 240,542" class="gate"/>
  <text x="400" y="537" class="t" text-anchor="middle">4 · GATES (sem LLM)</text>
  <text x="400" y="556" class="s" text-anchor="middle">segredos · lint · build · testes</text>

  <path d="M240,542 H140 V420 H248" class="e"/>
  <text x="148" y="508" class="l">FAIL</text>
  <text x="148" y="524" class="l">(conta rodada)</text>

  <line x1="400" y1="592" x2="400" y2="618" class="e"/>
  <text x="410" y="610" class="l">PASS</text>

  <!-- 5 REVIEW -->
  <rect x="250" y="620" width="300" height="68" rx="10" class="step"/>
  <text x="400" y="644" class="t" text-anchor="middle">5 · REVIEW (em paralelo)</text>
  <text x="400" y="663" class="s" text-anchor="middle">tests · code · security</text>
  <text x="400" y="680" class="s" text-anchor="middle">+ ui · ux quando o diff toca UI</text>

  <line x1="550" y1="654" x2="688" y2="654" class="eh"/>
  <text x="664" y="646" class="lh" text-anchor="middle">falha 2×</text>
  <rect x="690" y="620" width="310" height="68" rx="10" class="human"/>
  <text x="845" y="644" class="t" text-anchor="middle">🧑 needs-human</text>
  <text x="845" y="663" class="s" text-anchor="middle">revisor sem VERDICT válido duas vezes</text>
  <text x="845" y="680" class="s" text-anchor="middle">veja review-&lt;nome&gt;.md</text>

  <line x1="400" y1="688" x2="400" y2="712" class="e"/>

  <!-- 6 DECIDIR -->
  <polygon points="400,714 540,764 400,814 260,764" class="gate"/>
  <text x="400" y="760" class="t" text-anchor="middle">6 · DECIDIR</text>
  <text x="400" y="779" class="s" text-anchor="middle">VERDICT de cada revisor</text>

  <path d="M260,764 H90 V444 H248" class="e"/>
  <text x="98" y="790" class="l">CHANGES e</text>
  <text x="98" y="806" class="l">round &lt; max</text>

  <line x1="400" y1="814" x2="400" y2="878" class="e"/>
  <text x="410" y="846" class="l">todos PASS, ou CHANGES</text>
  <text x="410" y="862" class="l">na última rodada</text>

  <!-- 7 APPROVE -->
  <rect x="250" y="880" width="300" height="68" rx="10" class="step"/>
  <text x="400" y="904" class="t" text-anchor="middle">7 · APPROVE</text>
  <text x="400" y="923" class="s" text-anchor="middle">approver confere cada AC</text>
  <text x="400" y="940" class="s" text-anchor="middle">decision.md: APPROVE ou ESCALATE</text>

  <line x1="550" y1="914" x2="688" y2="914" class="eh"/>
  <text x="619" y="906" class="lh" text-anchor="middle">ESCALATE</text>

  <line x1="400" y1="948" x2="400" y2="972" class="e"/>
  <text x="410" y="966" class="l">APPROVE</text>

  <!-- Gates finais -->
  <polygon points="400,974 540,1022 400,1070 260,1022" class="gate"/>
  <text x="400" y="1018" class="t" text-anchor="middle">gates de novo</text>
  <text x="400" y="1037" class="s" text-anchor="middle">no estado final</text>

  <line x1="540" y1="1022" x2="688" y2="1022" class="eh"/>
  <text x="619" y="1014" class="lh" text-anchor="middle">FAIL</text>

  <!-- H3 escalate -->
  <rect x="690" y="880" width="310" height="176" rx="10" class="human"/>
  <text x="845" y="905" class="t" text-anchor="middle">🧑 needs-human</text>
  <text x="845" y="925" class="s" text-anchor="middle">ESCALATE ou gates finais com FAIL</text>
  <text x="845" y="943" class="s" text-anchor="middle">leia a seção Motivo de decision.md</text>
  <text x="845" y="961" class="s" text-anchor="middle">e revise a branch factory/&lt;id&gt;</text>
  <line x1="712" y1="975" x2="978" y2="975" stroke="#e8b98a"/>
  <text x="712" y="999" class="c">/qubit approve &lt;id&gt;</text>
  <text x="978" y="999" class="s" text-anchor="end">→ merge</text>
  <text x="712" y="1025" class="c">/qubit rework &lt;id&gt; &lt;nota&gt;</text>
  <text x="978" y="1043" class="s" text-anchor="end">→ volta ao BUILD</text>

  <line x1="400" y1="1070" x2="400" y2="1108" class="e"/>
  <text x="410" y="1094" class="l">PASS</text>

  <!-- 8 MERGE -->
  <rect x="250" y="1110" width="300" height="68" rx="10" class="step"/>
  <text x="400" y="1134" class="t" text-anchor="middle">8 · MERGE local</text>
  <text x="400" y="1153" class="s" text-anchor="middle">git merge --no-ff na branch base</text>
  <text x="400" y="1170" class="s" text-anchor="middle">nunca há git push</text>

  <line x1="550" y1="1144" x2="688" y2="1144" class="e"/>
  <text x="619" y="1136" class="l" text-anchor="middle">conflito</text>
  <rect x="690" y="1110" width="310" height="68" rx="10" class="step"/>
  <text x="845" y="1134" class="t" text-anchor="middle">rebase automático</text>
  <text x="845" y="1153" class="s" text-anchor="middle">builder faz rebase + gates</text>
  <text x="845" y="1170" class="s" text-anchor="middle">segunda tentativa de merge</text>

  <path d="M690,1170 L552,1222" class="e"/>
  <text x="612" y="1214" class="l" text-anchor="middle">ok</text>

  <line x1="845" y1="1178" x2="845" y2="1236" class="eh"/>
  <text x="855" y="1212" class="lh">falhou de novo</text>
  <rect x="690" y="1238" width="310" height="60" rx="10" class="human"/>
  <text x="845" y="1262" class="t" text-anchor="middle">🧑 needs-human</text>
  <text x="845" y="1282" class="s" text-anchor="middle">conflito persistente: resolva à mão</text>

  <line x1="400" y1="1178" x2="400" y2="1206" class="e"/>
  <text x="410" y="1198" class="l">ok</text>

  <!-- DONE -->
  <rect x="250" y="1208" width="300" height="60" rx="30" class="ok"/>
  <text x="400" y="1233" class="t" text-anchor="middle">✅ merged</text>
  <text x="400" y="1252" class="s" text-anchor="middle">worktree removido · backlog marcado [x]</text>
  <line x1="400" y1="1268" x2="400" y2="1296" class="e"/>

  <!-- 9 APRENDER -->
  <rect x="250" y="1298" width="300" height="68" rx="10" class="step"/>
  <text x="400" y="1322" class="t" text-anchor="middle">9 · APRENDER</text>
  <text x="400" y="1341" class="s" text-anchor="middle">learner propõe lições → lessons.md</text>
  <text x="400" y="1358" class="s" text-anchor="middle">roda também depois de needs-human</text>

  <!-- Rodapé -->
  <rect x="40" y="1396" width="960" height="44" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="520" y="1423" class="s" text-anchor="middle">Teto de custo: se as chamadas de agente chegarem a max_agent_calls, qualquer etapa para em 🧑 needs-human.</text>

  <rect x="40"  y="1458" width="18" height="14" rx="3" class="step"/><text x="66"  y="1470" class="s">etapa automática</text>
  <rect x="200" y="1458" width="18" height="14" rx="3" class="gate"/><text x="226" y="1470" class="s">decisão / gate</text>
  <rect x="350" y="1458" width="18" height="14" rx="3" class="human"/><text x="376" y="1470" class="s">exige você</text>
  <rect x="480" y="1458" width="18" height="14" rx="3" class="ok"/><text x="506" y="1470" class="s">concluído</text>
</svg>
